<text x="285" y="501" text-anchor="middle" font-size="18">Q3</text>
<text x="365" y="440" text-anchor="middle" font-size="17" fill="#b8cbdc">未取得</text>
<text x="365" y="501" text-anchor="middle" font-size="18">Q4</text>
<text x="536" y="150" font-size="24" font-weight="700">単独 / Standalone</text>
<text x="536" y="181" font-size="17" fill="#b8cbdc">その3か月間だけの金額</text>
<path d="M 536 470 h 330" stroke="#30425c"/>
<text x="524" y="476" text-anchor="end" font-size="16" fill="#b8cbdc">0</text>
