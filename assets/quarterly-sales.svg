<text x="40" y="87" font-size="18" fill="#b8cbdc">Synthetic data · 架空の学習用データ · 単位：億円 / JPY 100 million</text>
<text x="76" y="150" font-size="24" font-weight="700">累計 / Cumulative</text>
<text x="76" y="181" font-size="17" fill="#b8cbdc">年度の初めから積み上げた金額</text>
