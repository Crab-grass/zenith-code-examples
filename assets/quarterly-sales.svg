<text x="480" y="586" text-anchor="middle" dominant-baseline="central" font-size="29" font-weight="700">Q2：45 − 20 ＝ 25 億円</text>
<text x="40" y="672" font-size="18" fill="#b8cbdc">Q4の欠損は0にしない。通期予想からQ4実績は計算しない。</text>
