<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Disclosure Reader · ZENITH Code</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip"></a>
    <div class="app">
      <aside class="rail">
        <div class="rail-top">
          <a class="brand" href="https://zenithcode.net" target="_blank" rel="noreferrer">ZENITH <span>Code</span></a>
          <p class="rail-title"><span data-i18n="title"></span><small data-i18n="titleSub"></small></p>
          <p class="rail-note" data-i18n="railNote"></p>
        </div>
        <nav id="viewNav" class="view-nav" aria-label="Views"></nav>
        <div class="rail-foot">
          <span class="tiny" data-i18n="buildYourOwn"></span>
          <p data-i18n="templateNote"></p>
          <a href="https://github.com/Crab-grass/zenith-code-examples/tree/main/templates/disclosure-reader" target="_blank" rel="noreferrer" data-i18n="viewCode"></a>
        </div>
      </aside>

      <div class="main-column">
        <header class="toolbar">
          <div class="seg" role="group" data-i18n-label="dataMode">
            <button id="demoMode" type="button" aria-pressed="true" data-i18n="demo"></button>
            <button id="liveMode" type="button" aria-pressed="false" data-i18n="live"></button>
          </div>
          <div class="prefs">
            <div class="seg" role="group" data-i18n-label="language">
              <button id="ja" type="button" lang="ja">JA</button><button id="en" type="button" lang="en">EN</button>
            </div>
            <button id="themeToggle" class="icon-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" /><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
            </button>
          </div>
        </header>

        <section class="picker" aria-labelledby="pickTitle">
          <div class="picker-head">
            <h2 id="pickTitle" data-i18n="pickTitle"></h2>
            <p id="countHint" class="hint"></p>
          </div>
          <ul id="picks" class="picks" aria-live="polite"></ul>
          <form id="addForm" class="add" novalidate hidden>
            <label class="visually-hidden" for="addInput" data-i18n="addCode"></label>
            <input id="addInput" autocomplete="off" spellcheck="false" maxlength="7" placeholder="7203" />
            <button type="submit" class="ghost" data-i18n="add"></button>
          </form>
          <div class="picker-foot">
            <p id="pickHint" class="hint"></p>
            <button id="loadButton" type="button" class="primary"></button>
          </div>
          <p id="requestNote" class="hint request"></p>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <section id="setup" class="setup" hidden>
          <h2 data-i18n="setupTitle"></h2>
          <p data-i18n="setupBody"></p>
          <code>python3 templates/disclosure-reader/server.py --live</code>
          <p data-i18n="setupKey"></p>
          <a id="signupLink" href="https://zenithcode.net/sign-up" target="_blank" rel="noreferrer" data-i18n="signup"></a>
        </section>

        <main id="main" tabindex="-1">
          <div class="view-head">
            <p id="viewEyebrow" class="eyebrow"></p>
            <h1 id="viewTitle"></h1>
            <p id="viewLead" class="lead"></p>
          </div>
          <div id="emptyState" class="empty-state" hidden><p data-i18n="noCompanies"></p></div>
          <div id="view"></div>
          <p id="attribution" class="attribution"></p>
        </main>
        <footer class="footer">
          <p data-i18n="footerNote"></p>
          <a id="termsLink" href="https://zenithcode.net/docs/display-rights" target="_blank" rel="noreferrer" data-i18n="dataTerms"></a>
        </footer>
      </div>
    </div>
  </body>
</html>
